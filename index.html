
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#005eb8" />
    <title>ELFT Sites & Teams Locator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      :root {
        --app-height: 100%;
      }
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        position: fixed; /* Prevent rubber-banding on iOS */
      }
      .leaflet-container {
        height: 100%;
        width: 100%;
        z-index: 1;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #005eb8;
        border-radius: 10px;
      }
      /* PWA Tweaks */
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Custom Leaflet tooltip styling */
      .custom-marker-tooltip {
        background: white !important;
        border: 2px solid #005eb8 !important;
        border-radius: 12px !important;
        box-shadow: 0 4px 12px rgba(0, 94, 184, 0.2) !important;
        padding: 0 !important;
        margin-top: -5px !important;
      }
      .custom-marker-tooltip::before {
        border-top-color: #005eb8 !important;
        border-width: 8px !important;
        margin-left: -8px !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "leaflet": "https://aistudiocdn.com/leaflet@^1.9.4",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 antialiased">
    <div id="root" class="h-full w-full"></div>
    <script>
      // Fix for mobile 100vh issue
      const documentHeight = () => {
        const doc = document.documentElement;
        doc.style.setProperty('--app-height', `${window.innerHeight}px`);
      }
      window.addEventListener('resize', documentHeight);
      documentHeight();
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
